[tools]
go = "1.27.3"
golangci-lint = "2.15.0"
goreleaser = "2.19.0"
"go:golang.org/x/vuln/cmd/govulncheck" = "1.9.0"
hk = "2.8.1"
pkl = "0.32.2"
actionlint = "1.7.12"
zizmor = "1.31.1"
typos = "1.51.1"
usage = { version = "7.1.2", workflow = "publish-cli.yml" }
# elan installs the Lean version in verify/lean-toolchain. The release has one
# binary, elan-init, that acts as elan, lake or lean by the name it runs as.
"github:leanprover/elan" = { version = "4.2.4", postinstall = 'for n in elan lake lean; do ln -sf elan-init "$MISE_TOOL_INSTALL_PATH/$n"; done' }

[env]
CGO_ENABLED = "0"

[tasks.build]
description = "Build the gh-tmpl binary"
run = "go build -trimpath -o gh-tmpl ."

[tasks.test]
description = "Run the tests"
run = "go test ./..."

[tasks."test:race"]
description = "Run the tests with the race detector"
env = { CGO_ENABLED = "1" }
run = "go test -race ./..."

[tasks.lint]
description = "Run golangci-lint"
run = "golangci-lint run"

[tasks.vuln]
description = "Scan dependencies for known vulnerabilities"
run = "govulncheck ./..."

[tasks."lint:actionlint"]
description = "Lint the GitHub Actions workflows with actionlint"
run = "actionlint"

# zizmor fails on findings of low severity or worse. It runs the online audits
# only when GH_TOKEN or GITHUB_TOKEN is set.
[tasks."lint:zizmor"]
description = "Audit the GitHub Actions workflows with zizmor"
run = "zizmor --persona=auditor --min-severity=low .github"

[tasks."lint:actions"]
description = "Lint and audit the GitHub Actions workflows"
depends = ["lint:actionlint", "lint:zizmor"]

[tasks."release:check"]
description = "Validate the GoReleaser config"
run = "goreleaser check"

[tasks."release:snapshot"]
description = "Build every release artifact locally, without publishing"
run = "goreleaser release --snapshot --clean"

[tasks."generate:go"]
description = "Generate the Go parser from gh-tmpl.usage.kdl"
run = "usage generate go -f gh-tmpl.usage.kdl -o internal/spec/spec.go -p spec"

[tasks."generate:docs"]
description = "Generate the command reference and the man page from gh-tmpl.usage.kdl"
run = [
  "rm -rf docs/reference",
  "usage generate markdown --multi --indented-blocks-to-code-fences --out-dir docs/reference -f gh-tmpl.usage.kdl",
  "mkdir -p man",
  "usage generate manpage -f gh-tmpl.usage.kdl -o man/gh-tmpl.1",
]

[tasks."generate:completions"]
description = "Generate the shell completion scripts from the generated parser"
depends = ["generate:go"]
run = [
  "mkdir -p completions",
  "go run . completion bash > completions/gh-tmpl.bash",
  "go run . completion zsh > completions/_gh-tmpl",
  "go run . completion fish > completions/gh-tmpl.fish",
  "go run . completion nu > completions/gh-tmpl.nu",
  "go run . completion powershell > completions/gh-tmpl.ps1",
]

[tasks.generate]
description = "Regenerate everything that comes from gh-tmpl.usage.kdl"
depends = ["generate:go", "generate:docs", "generate:completions"]

[tasks."generate:check"]
description = "Fail if regenerating from gh-tmpl.usage.kdl changes any file"
depends = ["generate"]
run = """
paths="gh-tmpl.usage.kdl internal/spec docs/reference man completions"
untracked=$(git ls-files --others --exclude-standard -- $paths)
if ! git --no-pager diff --exit-code -- $paths || [ -n "$untracked" ]; then
  echo "Generated files are out of date. Run 'mise run generate' and commit the result."
  [ -n "$untracked" ] && echo "New files: $untracked"
  exit 1
fi
"""

[tasks.verify]
description = "Check the Lean proofs in verify/ and write the Lean test cases again"
dir = "verify"
run = [
  "lake build --wfail",
  "lake exe corpus ..",
]

[tasks."verify:check"]
description = "Fail if a Lean proof fails or the Lean test cases are out of date, then run the differential tests"
depends = ["verify"]
run = """
paths="internal/check/testdata/lean internal/cli/testdata/lean internal/discover/testdata/lean"
untracked=$(git ls-files --others --exclude-standard -- $paths)
if ! git --no-pager diff --stat --exit-code -- $paths || [ -n "$untracked" ]; then
  echo "The Lean test cases are out of date. Run 'mise run verify' and commit the result."
  [ -n "$untracked" ] && echo "New files: $untracked"
  exit 1
fi
go test -run MatchesLean ./internal/...
"""

[tasks.check]
description = "Run every check that CI runs, except the Lean proofs (mise run verify:check)"
depends = ["test", "lint", "vuln", "lint:actions", "release:check", "generate:check"]

[tasks.install-local]
description = "Build the extension and install it into gh from this folder, which must be named gh-tmpl"
depends = ["build"]
run = "gh extension install ."
